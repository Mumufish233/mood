<div class="wrap">
  <h1>天宝模拟器</h1>

  <div class="sub" style="margin-top:6px"><a href="./ai-report.html" style="color:#b39a5f;text-decoration:none">AI 试玩报告 →</a></div>

    </div>
    <div id="chronicle" class="chronicle"></div>
    <div class="slot-title">国事 · 三选一</div>
    <div class="cards" id="cards"></div>
    <div class="slot-title">私人事件 · 可选一条（也可以不折腾）</div>
    <div class="cards" id="privCards"></div>
    <button class="btn" id="btn-settle">结算本回合</button>
    <div class="log" id="log"></div>
  </div>

  <div id="screen-end" class="hide">
    <div class="end">
      <h2 id="end-title"></h2>
      <p class="quote" id="end-quote"></p>
      <p class="praise" id="end-praise"></p>
      <p class="sigh" id="end-sigh"></p>
      <span class="btn" id="btn-again">再来一局</span>
      <span class="btn gh" id="btn-share" style="margin-left:8px">复制这一局</span>
      <div id="share-tip" style="font-size:12px;color:#8d8271;margin-top:10px"></div>
    </div>
  </div>

function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const $ = (id) => document.getElementById(id);

function showFacts() {
  const box = $("facts");
  box.innerHTML = "";
  Object.keys(FACS).forEach((name) => {
    const el = document.createElement("div");
    el.className = "fact";
    el.innerHTML = `<h3>${name} \u00b7 ${FACS[name].tag}</h3><p>${FACS[name].desc}</p>`;
    el.onclick = () => start(name);
    box.appendChild(el);
  });
}

function start(fac) {
  st = { round: 1, fac, money: 5, name: 5, army: 5, combo: 0,
         pool: shuffle(deckOf(fac).slice()), log: [], ach: [], hist: [],
         step: "card", pendingCard: null, pendingPriv: null, priv: [], flags: [], flagLog: [],
         privPool: shuffle((PRIVATE_LITE[privKey(fac)] || []).slice()) };
  $("screen-start").classList.add("hide");
  $("screen-end").classList.add("hide");
  $("screen-play").classList.remove("hide");
  render();
}

function updateBars() {
  ["money", "name", "army"].forEach((k) => {
    const el = $("bar-" + k);
    if (el) el.style.width = Math.max(2, Math.min(100, (st[k] / MAXV) * 100)) + "%";
    const v = $("val-" + k);
    if (v) v.textContent = st[k];
  });
}

function render() {
  $("round").textContent = st.round;
  $("fac-pill").textContent = st.fac;
  updateBars();
  $("chronicle").innerHTML = "";
  renderSlots();
  $("log").innerHTML = st.log.map((x) => `<div>${x}</div>`).join("");
}

/* 私事数据按史称（范阳）存，游戏里势力叫河北 → 做个映射，否则河北永远没有私事 */
function privKey(fac) {
  if (PRIVATE_LITE[fac]) return fac;
  if (fac === "河北" || fac === "范阳") return "范阳";
  return Object.keys(PRIVATE_LITE)[0];
}

function updateSettle() {
  const b = $("btn-settle");
  if (!b) return;
  const ready = st.pendingCard !== null;
  b.className = "btn" + (ready ? "" : " off");
  b.textContent = ready ? "结算本回合" : "先选一件国事";
}

function renderSlots() {
  // 上：国事三选一
  const box = $("cards");
  box.innerHTML = "";
  st.pool.slice(0, 3).forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "card" + (st.pendingCard === i ? " on" : "");
    const parts = Object.keys(c.e).map((k) => {
      const label = { money: "钱", name: "名", army: "兵" }[k];
      const v = c.e[k];
      return `${label}${v > 0 ? "+" : ""}${v}`;
    }).join("　");
    el.innerHTML = `<h3>${c.t}</h3><p>${c.d}</p><div class="eff">${parts}</div>`;
    el.onclick = () => { st.pendingCard = i; render(); };
    box.appendChild(el);
  });

  // 下：私人事件（独立槽）
  const pbox = $("privCards");
  pbox.innerHTML = "";
  if (st.privPool.length < 3) {
    const pool = (PRIVATE_LITE[privKey(st.fac)] || []).filter((x) => (st.priv || []).indexOf(x.name) < 0);
    st.privPool = shuffle((pool.length >= 3 ? pool : (PRIVATE_LITE[privKey(st.fac)] || [])).slice());
  }
  const opts = st.privPool.slice(0, 3);
  opts.forEach((p) => {
    const el = document.createElement("div");
    el.className = "card" + (st.pendingPriv === p.id ? " on" : "");
    const parts = Object.keys(p.eff).map((k) => {
      const label = { money: "钱", name: "名", army: "兵" }[k];
      const v = p.eff[k];
      return `${label}${v > 0 ? "+" : ""}${v}`;
    }).join("　");
    const VAGUE = ["朝中有人盯着", "驿路上不太平", "有人在记这笔账", "营里传了闲话", "宫里递了话"];
    const hint = p.flag ? `<div class="eff" style="color:#b0806a">隐约觉得：${VAGUE[(p.name.length + p.note.length) % VAGUE.length]}</div>` : "";
    el.innerHTML = `<h3>${p.name}</h3><p>${p.note}</p><div class="eff">${parts}</div>${hint}`;
    el.onclick = () => { st.pendingPriv = (st.pendingPriv === p.id ? null : p.id); render(); };
    pbox.appendChild(el);
  });
  updateSettle();
  const skip = document.createElement("div");
  skip.className = "card" + (st.pendingPriv === null ? " on" : "");
  skip.innerHTML = "<h3>这次不折腾</h3><p>把心思都放在国事上。</p>";
  skip.onclick = () => { st.pendingPriv = null; render(); };
  pbox.appendChild(skip);
}

function pick(c) { /* 兼容旧调用：直接当作已选国事 */ }

function settleRound() {
  if (st.pendingCard === null) { toast("先选一件国事"); return; }
  const card = st.pool[st.pendingCard];
  // 1) 国事
  Object.keys(card.e).forEach((k) => {
    st[k] = Math.max(0, Math.min(MAXV, st[k] + card.e[k]));
  });
  st.hist.push(card);
  st.log.unshift(`第${st.round}回 · ${card.t}`);
  if (!card.repeat) st.pool = st.pool.filter((x) => x.id !== card.id);
  // 2) 私事
  const priv = (st.privPool || []).find((x) => x.id === st.pendingPriv) || null;
  if (priv) {
    Object.keys(priv.eff).forEach((k) => {
      st[k] = Math.max(0, Math.min(MAXV, st[k] + priv.eff[k]));
    });
    st.priv.push(priv.name);
    st.log.unshift(`　私事 · ${priv.name}`);
    if (priv.flag) { st.flags.push(priv.flag); st.log.unshift(`　└ 埋下隐患：${priv.flag.name}`); }
    st.privPool = st.privPool.filter((x) => x.id !== priv.id || priv.name.indexOf("爱妃") >= 0);
  } else {
    st.log.unshift("　私事 · 没折腾");
  }
  st.pendingCard = null;
  st.pendingPriv = null;
  checkAch();
  if (st.godown) return finishCarnal();
  if (st.money <= 0 || st.army <= 0 || st.name <= 0) return finish();
  if (highFameEvent()) return playDeathLine("behead");
  if (poorTick()) return playDeathLine("poor");
  const dl = deathLine();
  if (dl) return playDeathLine(dl);
  if (st.round >= ROUNDS) return finish();
  st.round += 1;
  if (st.pool.length < 3) st.pool = st.pool.concat(deckOf(st.fac));
  render();
}

function unlock(a) {
  if (st.ach.some((x) => x.id === a.id)) return;
  st.ach.push(a);
  toast(`成就解锁 · ${a.name}　封号 ${facTitle(a.title)}`);
}

function checkAch() {
  const h = st.hist;
  const n = h.length;
  const all = (fn) => h.every(fn);
  const count = (id) => h.filter((x) => x.id === id).length;

  if (n >= 5 && all((c) => (c.e.money || 0) > 0)) unlock(ACH.find((a) => a.id === "money5"));
  if (n >= 5 && all((c) => (c.e.army || 0) > 1)) unlock(ACH.find((a) => a.id === "army5"));
  if (n >= 5 && all((c) => (c.e.name || 0) > 0)) unlock(ACH.find((a) => a.id === "name5"));
  if (n >= 5 && all((c) => !(c.e.money > 0))) unlock(ACH.find((a) => a.id === "nomoney"));
  if (n >= 5 && st.name <= 2 && st.money >= 8) unlock(ACH.find((a) => a.id === "forget"));
  const privLove = (st.priv || []).filter((n) => n.indexOf("爱妃") >= 0).length + count("consort");
  if (privLove >= 2) unlock(ACH.find((a) => a.id === "consort2"));
  if (privLove >= 3) { unlock(ACH.find((a) => a.id === "consort3")); st.godown = true; }
  if (count("consort") >= 3) {
    unlock(ACH.find((a) => a.id === "consort3"));
    st.godown = true;
  }
  if (count("relief") === 0 && st.name <= 4 && n >= 4) unlock(ACH.find((a) => a.id === "pardon3"));
  if (n >= 5) unlock(ACH.find((a) => a.id === "survive5"));
  if (Math.min(st.money, st.name, st.army) >= 12) unlock(ACH.find((a) => a.id === "prosper"));
  if ((st.flagLog || []).length >= 2) unlock(ACH.find((a) => a.id === "scapecat"));
  if (st.name >= 9 && st.army <= 3) unlock(ACH.find((a) => a.id === "fengxian"));
  if (st.money <= 2 && st.round >= 4) unlock(ACH.find((a) => a.id === "nomoney2"));
  if ((st.priv || []).filter((n) => n.indexOf("不折腾") >= 0).length >= 3) unlock(ACH.find((a) => a.id === "gentle"));

  if (n >= 5 && st.army >= 6 && all((c) => !(c.e.army > 0))) unlock(ACH.find((a) => a.id === "freesoldier"));
  if (n >= 4 && Math.max(st.money, st.name, st.army) >= 9 && Math.min(st.money, st.name, st.army) <= 2) {
    unlock(ACH.find((a) => a.id === "lopsided"));
  }
  if (n >= 5 && Math.min(st.money, st.name, st.army) >= 8) unlock(ACH.find((a) => a.id === "balanced"));
}

let toastTimer = null;
function toast(text) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    (document.body || document.documentElement || document).appendChild(el);
  }
  el.textContent = text;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function finishCarnal() {
  $("screen-play").classList.add("hide");
  $("screen-end").classList.remove("hide");
  const a = ACH.find((x) => x.id === "consort3");
  $("end-title").textContent = "驾崩";
  $("end-quote").textContent = "春宵苦短日高起，从此君王不早朝。";
  $("end-praise").textContent = "你天天宠信爱妃，没几年就死了。大唐还是盛世的那个大唐——以你的行为，大概率是昏君。";
  $("end-sigh").textContent = `封号 · 唐社宗。成就 · 色是刮骨刀，驾崩吧！陛下！\n\n百姓谢谢你，史官只写了半页。`;
}

function monoKind() {
  const vals = { money: st.money, name: st.name, army: st.army };
  const keys = Object.keys(vals);
  const mx = Math.max(...keys.map((k) => vals[k]));
  const mn = Math.min(...keys.map((k) => vals[k]));
  if (!(mx >= 11 && mn <= 3)) return null;   // 只看极差：一项很高、另一项很低才算偏科
  return keys.sort((a, b) => vals[b] - vals[a])[0];
}


/* 斩杀线判定：兵/名/钱的红线 */
function deathLine() {
  // 兵见底才是硬红线；名高兵低走"朝廷来人"事件，不一刀切
  if (st.army <= 1) return "behead";
  return null;
}

/* 名高兵低：朝廷来人了，看给不给面子 */
function highFameEvent() {
  if (!(st.name >= 8 && st.army <= 2)) return false;
  if (!st.fameWarn) {
    st.fameWarn = true;
    if (Math.random() < 0.6) {
      st.money = Math.max(0, st.money - 3);
      st.name = Math.max(0, st.name - 2);
      st.log.unshift("🏛 朝廷来人了：破财消灾，名分上也让了一步。");
      toast("朝廷来人了 · 破财消灾");
      return false;
    }
    st.log.unshift("🏛 朝廷来人了：你没给面子。");
    toast("朝廷来人了 · 没给面子");
    return false;   // 先警告，下一轮还越线才动刀
  }
  // 已经警告过一次还在越线 → 动刀
  return true;
}


/* ===== 称号系统（势力称号池 + 正史庙号 + 双写） ===== */
const TITLES = {
  "唐廷": { win: ["中兴之主", "天可汗", "再造大唐"], mid: ["守成之君", "偏安天子"],
            low: ["傀儡天子", "亡国之君"], funny: ["唐扒皮", "唐社宗", "唐饥宗", "唐辩宗"] },
  "河北": { win: ["河北救世主", "天命圣人", "汗上之汗"],
            evil: ["篡逆权臣", "窃国之贼"],
            mid: ["范阳节度使", "北地大帅"], low: ["一介叛将", "杀年猪"],
            funny: ["肥胖的小丑", "奴隶主义的先锋队", "好色胖子", "LV10胡旋舞者"] },
  "河朔": { win: ["真龙在野", "草蛇吞象", "乱世枭雄", "天命归晋", "人民保卫者"],
            mid: ["三镇之主", "牙兵大帅"], low: ["被换掉的帅", "没人记得的节度使"],
            funny: ["白日野心家", "戏曲行为大师", "出头的笨鸟", "俺寻思大能"] },
};

const OFFICIAL = {
  "唐廷": { win: ["唐德宗", "唐宣宗"], mid: ["唐顺宗", "唐宪宗"],
            low: ["唐哀帝", "唐僖宗"], funny: ["唐灵宗", "唐炀宗"] },
  "河北": { win: ["燕武烈王", "燕昭成王"], mid: ["范阳郡王", "卢龙节度使"],
            low: ["燕留后", "燕都将"], funny: ["燕使相", "赐铁券"] },
  "河朔": { win: ["魏武公", "魏昭公"], mid: ["魏国公", "魏郡公"],
            low: ["魏牙将", "魏小校"], funny: ["魏牙公", "魏哀公"] },
};

const HISTORIAN_LINES = [
  "史官翻遍谥法，实在找不出更合适的字。",
  "按谥法，本不该这么写。但史官想了想，还是写了。",
  "这一笔史官斟酌了很久，最后还是落下了。",
];

function facTitle(t) {
  if (!t) return t;
  if (st.fac === "河北") return t.replace(/^唐/, "燕").replace(/宗$/, "帝");
  if (st.fac === "河朔") return t.replace(/^唐/, "魏").replace(/宗$/, "帝");
  return t;
}

function pickTitle(fac, kind) {
  const t = TITLES[fac] || TITLES["唐廷"];
  let pool = t.low;
  if (kind === "win") {
    const dirty = (st.ach || []).some((a) => ["唐扒皮", "人民群众的最大敌人"].indexOf(a.name) >= 0);
    pool = (dirty && t.evil) ? t.evil : t.win;
  } else if (kind === "partial" || kind === "split") {
    pool = t.mid;
  } else if (kind === "carnal" || kind === "rot") {
    pool = t.funny;
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function officialTitle(fac, kind) {
  const o = OFFICIAL[fac] || OFFICIAL["唐廷"];
  let pool = o.low;
  if (kind === "win") pool = o.win;
  else if (kind === "partial" || kind === "split") pool = o.mid;
  else if (kind === "carnal" || kind === "rot") pool = o.funny;
  return pool[Math.floor(Math.random() * pool.length)];
}

function dualTitle(fac, kind) {
  const off = officialTitle(fac, kind);
  const folk = pickTitle(fac, kind);
  const line = HISTORIAN_LINES[Math.floor(Math.random() * HISTORIAN_LINES.length)];
  return `\n\n史官记：${line}\n正史庙号 · ${off}\n民间野史 · ${folk}`;
}

function playDeathLine(kind) {
  const c = kind === "poor" ? POOR_SOLDIER : BEHEAD;
  st.ach.push({ id: "deathline-" + kind, name: c.ach, title: c.titleAch });
  $("screen-play").classList.add("hide");
  $("screen-end").classList.remove("hide");
  $("end-title").textContent = kind === "poor" ? "穷丘八" : "乱臣贼子";
  $("end-quote").textContent = c.quote;
  $("end-praise").textContent = c.praise;
  const PIG = { "唐廷": "唐脍宗", "河北": "燕猪公", "河朔": "魏酱公" };
  const pigTitle = (kind === "behead") ? (PIG[st.fac] || "唐豚宗") : facTitle(c.titleAch);
  $("end-sigh").textContent = c.sigh + `\n\n称号 · ${pickTitle(st.fac, "low")}　成就 · ${c.ach}　封号 · ${pigTitle}`;
  return true;
}

/* 穷丘八：任一项见底就进状态；有救命牌，能脱困也会饿死 */
const RESCUE = [
  { id: "r_rob", t: "抢邻镇", d: "饿到这份上，脸面不值钱了。", e: { money: 3, name: -1 } },
  { id: "r_loan", t: "借饷", d: "向商人借，利息按天算。", e: { money: 3, army: -1 } },
  { id: "r_sell", t: "卖地", d: "把屯田卖了，换两个月的粮。", e: { money: 2, name: -1 } },
];

function poorTick() {
  const low = Math.min(st.money, st.name, st.army);
  if (!st.poor && st.army > 1 && low <= 2) {
    st.poor = true;
    st.poorRounds = 0;
    st.rescueGiven = false;
    st.log.unshift("📉 穷丘八：营里开始断粮。");
    toast("进入状态 · 穷丘八");
  }
  if (!st.poor) return false;

  st.poorRounds += 1;
  ["money", "name", "army"].forEach((k) => { st[k] = Math.max(0, st[k] - 1); });
  st.log.unshift("📉 穷困蔓延：三样各 -1。");

  if (!st.rescueGiven) {
    st.rescueGiven = true;
    st.pool = RESCUE.concat(st.pool);
    st.log.unshift("🆘 有人送来三条路：抢邻镇 / 借饷 / 卖地。");
  }

  if (Math.random() < 0.45) {
    const ev = MISERIES[Math.floor(Math.random() * MISERIES.length)];
    ["money", "name", "army"].forEach((k) => {
      if (ev.e[k]) st[k] = Math.max(0, st[k] + ev.e[k]);
    });
    st.log.unshift(`💀 ${ev.t}：${ev.d}`);
    toast(`又出事了 · ${ev.t}`);
  }

  const nowLow = Math.min(st.money, st.name, st.army);
  if (nowLow >= 4) {
    st.poorRecover = (st.poorRecover || 0) + 1;
    if (st.poorRecover >= 2) {
      st.poor = false;
      st.log.unshift("🌾 缓过来了：穷丘八的状态解除了。");
    }
  } else {
    st.poorRecover = 0;
  }

  if (st.poorRounds >= 3) return true;   // 饿死
  return false;
}

function finish() {
  $("screen-play").classList.add("hide");
  $("screen-end").classList.remove("hide");
  // 暗雷结算（私事埋下的东西）
  (st.flags || []).forEach((fl) => {
    if (Math.random() < fl.chance) {
      ["money", "name", "army"].forEach((k) => {
        if (fl.eff && fl.eff[k]) st[k] = Math.max(0, Math.min(MAXV, st[k] + fl.eff[k]));
      });
      st.flagLog.push(fl.text || fl.name);
    }
  });
  // 爱妃三连 → 驾崩
  if ((st.priv || []).filter((n) => n.indexOf("爱妃") >= 0).length >= 3) return finishCarnal();
  // 某一项归零 → 崩的方式不一样，别都叫兵变
  const zero = st.money <= 0 ? "money" : (st.army <= 0 ? "army" : (st.name <= 0 ? "name" : null));
  if (zero) {
    const tk = { money: "粮尽", army: "兵变", name: "众叛" }[zero];
    const c = ROT[zero];
    $("end-title").textContent = tk;
    $("end-quote").textContent = c.quote;
    $("end-praise").textContent = c.praise;
    $("end-sigh").textContent = c.sigh + dualTitle(st.fac, "low") + `\n\n成就 · ${c.ach}`;
    return;
  }
  const mk = (st.round > ROUNDS - 1) ? monoKind() : null;
  if (mk) {
    const r = ROT[mk];
    $("end-title").textContent = r.title;
    $("end-quote").textContent = r.quote;
    $("end-praise").textContent = r.praise;
    $("end-sigh").textContent = r.sigh + dualTitle(st.fac, "rot") + `\n\n封号 · ${r.titleAch}　成就 · ${r.ach}`;
    toast(`成就解锁 · ${r.ach}　封号 ${r.titleAch}`);
    return;
  }
  const low = Math.min(st.money, st.name, st.army);
  const h = HARD.find((x) => low >= x.min) || HARD[HARD.length - 1];
  const pool = COPY[st.fac][h.kind];
  const c = pool[Math.floor(Math.random() * pool.length)];
  const epi = (COPY[st.fac].epilogue || []);
  const ep = epi.length ? epi[Math.floor(Math.random() * epi.length)] : null;
  $("end-title").textContent = h.title;
  $("end-quote").textContent = c.quote;
  $("end-praise").textContent = c.praise;
  const achNames = st.ach.filter((x) => x.id !== "consort3").map((x) => x.name);
  const titleAch = st.ach.length ? facTitle(st.ach[st.ach.length - 1].title) : "";
  $("end-sigh").textContent = c.sigh
    + (titleAch ? `\n\n封号 · ${titleAch}` : "")
    + dualTitle(st.fac, h.kind)
    + (achNames.length ? `\n成就 · ${achNames.join(" / ")}` : "")
    + (ep ? `\n\n三年后 · ${ep.praise}` : "")
    + ((st.flagLog && st.flagLog.length) ? `\n\n后来 · ${st.flagLog.join("；")}` : "");
}


/* ===== 复制这一局：给真人反馈用 ===== */
function buildShareText() {
  const title = $("end-title").textContent;
  const pick = (st.hist || []).map((c) => c.t).slice(0, 6).join(" → ");
  const ach = (st.ach || []).map((a) => a.name).join(" / ") || "无";
  return [
    "【天宝模拟器 · 试玩反馈】",
    `势力：${st.fac}｜结局：${title}`,
    `我选的：${pick}`,
    `成就/封号：${ach}`,
    "",
    "我觉得（随便一句就行）：",
    "1. 这局好玩吗：",
    "2. 哪里最想吐槽：",
    "3. 会不会再玩一局：",
  ].join("\n");
}

function copyShare() {
  const text = buildShareText();
  const tip = $("share-tip");
  const done = () => { if (tip) tip.textContent = "已复制，粘到微信发我就行。"; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else {
    fallback();
  }
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {
      if (tip) tip.textContent = "复制失败，手动截个图也行。";
    }
    document.body.removeChild(ta);
  }
}

function backToPick() {
  $("screen-end").classList.add("hide");
  $("screen-play").classList.add("hide");
  $("screen-start").classList.remove("hide");
  st = null;
  showFacts();
}
$("btn-again").onclick = backToPick;
$("btn-settle").onclick = settleRound;
$("btn-share").onclick = copyShare;
showFacts();
</script>
</body></html>
