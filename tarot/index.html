<style>

       background:#07080f;position:relative;overflow-x:hidden;

  /* 魔法底：星云 + 魔法阵（固定，不随滚动） */

  /* 可读性遮罩 + 缓慢呼吸的光 */

  }
  .wrap{max-width:680px;margin:0 auto}

  /* ---------- 首屏 ---------- */

  .fan{position:relative;height:216px;margin:6px auto 2px;width:300px}
  .fan img{position:absolute;left:50%;top:0;width:132px;height:206px;border-radius:12px;
           box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 1px rgba(180,200,255,.12) inset;
           transform-origin:50% 92%}
  .fan img:nth-child(1){transform:translateX(-50%) translateX(-46px) rotate(-17deg)}

  .fan img:nth-child(3){transform:translateX(-50%) translateX(46px) rotate(17deg)}
  .fan::after{content:"";position:absolute;left:50%;bottom:-6px;width:190px;height:26px;

  .guide{color:#cfd8ea;font-size:15px;margin:0 0 18px;line-height:1.7}

  /* ---------- 按钮 ---------- */
  button{font:inherit;cursor:pointer;border:0;border-radius:14px}
  .mainbtn{width:100%;padding:17px;font-size:17px;font-weight:800;color:#0b0d14;

  .mainbtn small{display:block;font-weight:600;font-size:12.5px;opacity:.72;margin-top:2px}
  .quick{display:flex;gap:9px;margin:12px 0 4px}

  @keyframes s3{0%,100%{transform:translate(6px,0) rotate(4deg)}50%{transform:translate(10px,16px) rotate(2deg)}}

  #flipBox{position:fixed;inset:0;z-index:9997;background:#06070cf2;display:flex;

  /* 选牌格用牌背图案 */

            border:1px solid rgba(160,170,200,.16);border-radius:14px;padding:9px 14px;line-height:1.6}

  /* 扇形抽牌 */

  .fanCard{position:absolute;bottom:0;left:50%;width:88px;height:150px;margin-left:-44px;
           border-radius:10px;overflow:hidden;cursor:pointer;

  /* 正逆位区分 */

  .revflag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;

           background:rgba(255,90,90,.12);border:1px solid rgba(255,120,120,.3)}
  /* 牌背轻微流光 */
  .stack img{animation:sheen 6s ease-in-out infinite}

  /* 分段标题 */
  .cap{font-size:13px;letter-spacing:.1em;color:#7f8ca6;margin:14px 0 4px;

  .mumu-voice{background:rgba(120,110,200,.10);border:1px solid rgba(160,150,230,.22);

  .core{font-size:19px;font-weight:800;line-height:1.6;color:#ffd9b0;margin:6px 0 10px}
  .act{background:#1a2130;border:1px dashed #3a4a66;border-radius:12px;padding:12px;

  .act b{color:#ffc08a}
  .detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease-out,opacity .45s ease-out}
  .detail.open{max-height:2600px;opacity:1}
  .detail .fadeIn{animation:fadeSeg .5s ease-out both}
  @keyframes fadeSeg{from{transform:translateY(8px)}to{transform:none}}
  .morebtn{margin-top:10px;padding:9px 16px;border-radius:20px;font-size:13px;
           background:transparent;border:1px solid rgba(150,160,200,.28);color:#93a2b8}
  .sec{margin-top:9px;font-size:14px;color:#cfd8e8}
  .sec b{color:var(--b)}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

  .row button.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:600}

  .fold{cursor:pointer;color:#7f8ca6;text-decoration:underline}
</style>

<script>
// ===== 轻量埋点（本地，不上传，符合"不采集"承诺）=====
const TRACK = (() => {
  const KEY = 'mumu_track_v1';
  const S = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })();
  let t0 = Date.now();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function ev(name, extra) {
    const d = new Date();
    const day = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!S[day]) S[day] = {};
    S[day][name] = (S[day][name] || 0) + 1;
    if (extra && S[day]['_last']) delete S[day]['_last'];
    if (extra) S[day]['_last'] = { ev: name, at: Date.now(), extra };
    save();
  }
  // 停留时长：离开页面时记
  window.addEventListener('pagehide', () => {
    const sec = Math.round((Date.now() - t0) / 1000);
    ev('dwell_' + (sec < 10 ? '0-10s' : sec < 30 ? '10-30s' : sec < 60 ? '30-60s' : '60s+'));
  });
  ev('page_view');
  return { ev, dump: () => S, reset: () => { try { localStorage.removeItem(KEY); } catch(e){} } };
})();

// 数据面板：网址后面加 ?stats=1 查看（自己用，用户无感）
(function showStats() {
  if (!location.search.includes('stats=1')) return;
  setTimeout(() => {
    const d = TRACK.dump();
    const days = Object.keys(d).sort().slice(-7);
    let html = '<div style="position:fixed;inset:0;z-index:99999;background:#0b0d14ee;color:#eef2f9;' +
      'padding:24px;overflow:auto;font:14px/1.7 monospace">' +
      '<div style="font:700 20px sans-serif;margin-bottom:12px">📊 本地埋点（仅本机可见）</div>' +
      '<button onclick="this.parentElement.remove()" style="padding:8px 16px;margin-bottom:16px;' +
      'border-radius:8px;border:0;background:#c9a7ff;color:#111;font-weight:700">关闭</button>';
    if (!days.length) html += '<div>还没有数据</div>';
    days.forEach(day => {
      html += '<div style="margin:14px 0 6px;color:#ffc08a;font-weight:700">' + day + '</div>';
      Object.entries(d[day]).forEach(([k, v]) => {
        if (k.startsWith('_')) return;

function startSpread(s) {
  spread = s; picked = [];
  TRACK.ev('spread_' + (s.key || 'unknown'), {name: s.name});
  AMBIENT.start();          // 需要用户手势后才能起音，点击抽牌刚好
  $('home').classList.add('hidden');
  $('resultBox').classList.add('hidden');
  runRitual(() => {
    $('shuffleBox').classList.remove('hidden');
    setTimeout(() => {
      $('deck').classList.remove('shuffling');
      $('shuffleBox').classList.add('hidden');
      startPick();
    }, 1600);
  });
}

function shuffled(n) {
  const p = CARDS.map(c => ({...c, isRev: Math.random() < REV}));
  for (let i = p.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  return p.slice(0, n);
}

let chosenDomain = null;
const DOMAINS = [
  { k: 'emotion', n: '情绪' },
  { k: 'relation', n: '关系' },
  { k: 'work', n: '工作' },
  { k: 'body', n: '身体' },
  { k: 'self', n: '对自己的看法' }
];

function startPick() {
  pool = shuffled(12);
  const g = $('fanBox');
  g.innerHTML = '';
  const N = pool.length;
  const spreadDeg = 54;                       // 扇形总角度
  pool.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'fanCard';
    const t = i / (N - 1) - 0.5;              // -0.5 ~ 0.5
    const deg = t * spreadDeg;
    const x = t * 460;                        // 水平摊开
    const y = Math.abs(t) * 46;               // 两端下沉
    el.style.transform = `translate(${x}px, ${y}px) rotate(${deg}deg)`;
    el.innerHTML = '<img src="cards-webp/back.webp" alt=""><span class="num">' + (i + 1) + '</span>';
    el.onmouseenter = () => { el.style.transform = `translate(${x}px, ${y - 22}px) rotate(${deg}deg) scale(1.06)`; };
    el.onmouseleave = () => { el.style.transform = `translate(${x}px, ${y}px) rotate(${deg}deg)`; };
    el.onclick = () => pickOne(el, i);
    g.appendChild(el);
  });
  $('pickBox').classList.remove('hidden');
  $('pickHint').textContent = '从扇形里选第 1 张（' + spread.positions[0].label + '）';
}

function pickOne(el, i) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  picked.push(pool[i]);
  TRACK.ev('pick_card');

  if (picked.length < spread.count) {
    $('pickHint').textContent = '选第 ' + (picked.length + 1) + ' 张（' +
      spread.positions[picked.length].label + '）';
    return;
  }

  // ★ 翻牌仪式：牌背 → 翻面 → 停顿 0.7 秒 → 出结果
  $('pickBox').classList.add('hidden');
  const box = $('flipBox');
  box.classList.remove('hidden');
  const cardEl = $('flipCard');
  cardEl.classList.remove('flipped');
  const lastC = picked[picked.length - 1];
  const fn = String(lastC.n).padStart(2, '0');
  $('flipFront').src = deckPrefix + fn + '.webp' + IMG_V;
  TRACK.ev('flip_start');
  setTimeout(() => {
    cardEl.classList.add('flipped');
    AMBIENT.chime();          // 翻牌音效
    TRACK.ev('flip_open');
  }, 520);
  setTimeout(() => {
    box.classList.add('hidden');
    HISTORY.add(picked.slice(), spread ? spread.name : '今日一抽');
    render();
  }, 1900);
}

function imgTag(c, style) {
  const n = String(c.n).padStart(2, '0');
  return '<img src="' + deckPrefix + n + '.webp' + IMG_V + '" style="' + style + '" alt="" ' +
         'onerror="this.onerror=null;this.src=&#39;cards-db/' + n + '.png&#39;">';
}

function render(list) {
  const items = list || picked.map((c, i) => ({c, label: spread.positions[i].label,
                                               prompt: spread.positions[i].prompt}));
  let html = '<div class="flip">';
  items.forEach(it => {
    const rot = it.c.isRev ? 'transform:rotate(180deg)' : '';
    html += '<div class="slot"><div class="pos">' + it.label + '</div>' + imgTag(it.c, rot) + '</div>';
  });
  html += '</div>';

  items.forEach((it, idx) => {
    const c = it.c, rev = c.isRev;
    html += '<div class="rep">' +
      '<div style="color:var(--dim);font-size:12.5px">' + it.label + ' · ' + it.prompt + '</div>' +
      '<div class="hue">' + c.name +
      '<span style="font-size:13px;color:var(--dim)"> ' + c.en + '</span>' +
      (rev ? '<span class="revflag">逆位</span>' : '') + '</div>' +
      '<div style="color:var(--dim);font-size:12.5px;margin-bottom:8px">' +
      (c.element || '') + (c.planet ? ' · ' + c.planet : '') + '</div>' +

      // ---- 简化层：核心一句 / 今晚一件 / 金句 ----
      ((rev ? (c.zha_rev || c.zha) : c.zha) ? '<div class="core">' + (rev ? (c.zha_rev || c.zha) : c.zha) + '</div>' : '') +
      ((rev ? (c.song_rev || c.song) : c.song) ? '<div class="act"><b>今晚可以做的一件小事</b><br>' + (rev ? (c.song_rev || c.song) : c.song) + '</div>' : '') +
      ((rev ? (c.quote_rev || c.quote) : c.quote) ? '<div class="quote">「' + (rev ? (c.quote_rev || c.quote) : c.quote) + '」</div>' : '') +

      '<button class="morebtn" data-idx="' + idx + '">展开细节</button>' +

      // ---- 详细层：牌本身 / 木木的看法 / 三领域 ----
      '<div class="detail" id="detail-' + idx + '">' +
        '<div class="cap">这张牌在讲什么</div>' +
        '<div style="color:#cfd8e8;font-size:14.5px;line-height:1.8">' + c.story + '</div>' +
        '<div style="margin-top:8px;white-space:pre-line;font-size:15px">' + (rev ? c.rev_long : c.up_long) + '</div>' +
        ((c.scene_1 || c.scene_2) ?
          '<div class="cap">你现在可能是</div>' +
          (c.scene_1 ? '<div class="scene">' + c.scene_1 + '</div>' : '') +
          (c.scene_2 ? '<div class="scene">' + c.scene_2 + '</div>' : '') : '') +
        '<div class="cap">小鲸鱼木木的看法</div>' +
        (c.ming ? '<div class="ming"><b>这叫</b>　' + c.ming + '</div>' : '') +
        '<div style="color:var(--dim);font-size:13px;margin:10px 0 4px">' +
          (rev ? c.kw_rev : c.kw_up).join(' · ') + '</div>' +
        '<div class="sec"><b>在关系里</b>　' + (rev ? c.love_rev : c.love_up) + '</div>' +
        '<div class="sec"><b>在工作里</b>　' + (rev ? c.career_rev : c.career_up) + '</div>' +
        '<div class="sec"><b>在钱上</b>　' + (rev ? c.money_rev : c.money_up) + '</div>' +
      '</div>' +
      '</div>';
  });

  // 这件事关于什么（五选一，用 domains 里的闲置文案）
  if (items[0] && items[0].c.domains) {
    html = html.replace('<div class="row"><button id="again">', '__PLACEHOLDER__');
    html += '<div class="rep"><b>这件事更接近哪一类？</b>' +
      '<div style="color:#8b96ab;font-size:12.5px;margin:6px 0 10px">选一个，我按那条给你说</div>' +
      '<div id="domainBox2">' +
        Object.keys(items[0].c.domains).map(k =>
          '<button class="dm" data-k="' + k + '">' + (DOMAINS.find(d => d.k === k) || {n: k}).n + '</button>'
        ).join('') +
      '</div>' +
      '<div id="domainLine" style="margin-top:12px;font-size:15px;color:#ffd9b0;line-height:1.8"></div>' +
      '</div>';
    html = html.replace('__PLACEHOLDER__', '<div class="row"><button id="again">');
  }

  if (items.length > 1) {
    html += buildChain(items);
  }
  html += '<div class="rep"><b>今天给你的话</b><br>' + items[items.length - 1].c.affirmation + '</div>';
  if (HISTORY.count() > 1) {
    html += '<div class="rep" style="color:#93a2b8;font-size:13.5px">这是你在这里的第 ' +
            HISTORY.count() + ' 次抽牌。同一件事隔三天再抽，往往能看到变化。</div>';

    '<div class="row"><button class="ghost" id="ambientBtn">🔊 环境音</button></div>' +
    '<div class="row"><button class="ghost" id="saveCard">保存结果图</button>' +
    '<button class="ghost" id="shareText">复制分享文案</button></div>';

  const rb = $('resultBox');
  rb.innerHTML = html;
  TRACK.ev('result_view', {spread: spread ? spread.key : 'daily'});
  rb.classList.remove('hidden');
  rb.scrollIntoView({behavior: 'smooth'});
  $('again').onclick = () => {
    TRACK.ev('draw_again');
    AMBIENT.fade(2);
    picked = [];
    rb.classList.add('hidden');
    $('home').classList.remove('hidden');

// ===== 环境音 v5：塔罗的"声音印象" =====
// 依据（三个 AI 交叉验证）：
//  大众对占卜的默认音色 = 钟声(命运敲门) + 弦乐群(厚度) + 管风琴/合唱(神圣) + 竖琴(空灵)
//  命运感 = 持续低音(pedal point) + 三全音 + sus4挂留
//  和弦进行 Dm(add9) → Bbmaj7 → Gm(add9) → Asus4（D 小调，偶尔 G# 制造增四张力）
const AMBIENT = (() => {
  let ctx = null, master = null, wetIn = null, muted = false, timers = [], chordIdx = 0;
  const D2 = 73.42, A2 = 110.00;

  function makeIR(sec) {
    const rate = ctx.sampleRate, len = Math.floor(rate * sec);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / rate;
        d[i] = (Math.random() * 2 - 1) * Math.exp(-t / 1.1) + (i < rate * 0.03 ? (Math.random() * 2 - 1) * 0.4 : 0);
      }
    }
    return buf;
  }

  // ---- 管风琴/合唱音色：加法合成，泛音 1:0.5:0.3:0.2:0.15 ----
  function organNote(freq, t, dur, vol) {
    const HARM = [1, 0.5, 0.3, 0.2, 0.15];
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.linearRampToValueAtTime(vol, t + 1.2);          // 慢起音 = 沉重、不突
    env.gain.setValueAtTime(vol, t + Math.max(1.3, dur - 1.5));
    env.gain.linearRampToValueAtTime(0.0001, t + dur + 2.5);  // 长释放
    env.connect(master); env.connect(wetIn);
    [-5, 5].forEach(cents => {
      HARM.forEach((amp, k) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * (k + 1) * Math.pow(2, cents / 1200);
        const g = ctx.createGain(); g.gain.value = amp * 0.09;
        o.connect(g); g.connect(env); o.start(t); o.stop(t + dur + 3.5);
      });
    });
  }

  // ---- 弦乐：滤波锯齿，慢起音 + 揉弦 ----
  function stringNote(freq, t, dur, vol) {
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 1.2;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.linearRampToValueAtTime(vol, t + 0.55);
    env.gain.setValueAtTime(vol, t + Math.max(0.6, dur - 0.8));
    env.gain.linearRampToValueAtTime(0.0001, t + dur + 1.6);
    lp.connect(env); env.connect(master); env.connect(wetIn);
    [-7, 0, 7].forEach(cents => {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.value = freq * Math.pow(2, cents / 1200);
      const g = ctx.createGain(); g.gain.value = 0.05;
      o.connect(g); g.connect(lp);
      // 揉弦 5Hz ±6 cents
      const vib = ctx.createOscillator(); vib.frequency.value = 5;
      const vibG = ctx.createGain(); vibG.gain.value = freq * 0.0035;
      vib.connect(vibG); vibG.connect(o.frequency);
      vib.start(t); vib.stop(t + dur + 2);
      o.start(t); o.stop(t + dur + 2);
    });
  }

  // ---- 钟声：FM 合成（非整数比 = 金属感）----
  function bell(freq, t, vol) {
    const car = ctx.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    const mod = ctx.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * 1.4;
    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(freq * 1.8, t);              // 调制指数 ~1.8，快速衰减
    modGain.gain.exponentialRampToValueAtTime(1, t + 1.6);
    mod.connect(modGain); modGain.connect(car.frequency);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    env.gain.setTargetAtTime(0.0001, t + 0.02, 0.85);        // 2-4 秒长尾
    car.connect(env); env.connect(master); env.connect(wetIn);
    car.start(t); mod.start(t); car.stop(t + 6); mod.stop(t + 6);
  }

  // ---- 竖琴/音乐盒：短促正弦 + 高八度泛音 ----
  function harp(freq, t, vol) {
    [[1, vol], [2, vol * 0.18]].forEach(([mul, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.value = freq * mul;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.005);
      g.gain.setTargetAtTime(0.0001, t + 0.01, mul === 1 ? 0.45 : 0.18);
      o.connect(g); g.connect(master); g.connect(wetIn);
      o.start(t); o.stop(t + 3);
    });
  }

  // D3 F3 A3 E4 / Bb2 D3 F3 A3 / G2 Bb2 D3 A3 / A2 D3 E3 G3
  const CHORDS = [
    [146.83, 174.61, 220.00, 329.63],   // Dm(add9)
    [116.54, 146.83, 174.61, 220.00],   // Bbmaj7
    [ 98.00, 116.54, 146.83, 220.00],   // Gm(add9)
    [110.00, 146.83, 164.81, 196.00]    // Asus4
  ];

  function start() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.0001; master.connect(ctx.destination);
      // 混响：3 秒，湿 35%
      const conv = ctx.createConvolver(); conv.buffer = makeIR(3.0);
      const revHP = ctx.createBiquadFilter(); revHP.type = 'highpass'; revHP.frequency.value = 220;
      const wet = ctx.createGain(); wet.gain.value = 0.35;
      revHP.connect(conv); conv.connect(wet); wet.connect(master);
      wetIn = revHP;

      // 持续低音（pedal point）：D2 + A2，轻微不谐和
      // 手机外放几乎听不到 73Hz → 主低音抬到 146.83(D3)，73Hz 只作极小衬底
      [[146.83, 0.030], [220.00, 0.018], [D2, 0.012], [146.83 * Math.pow(2, 4 / 1200), 0.010]].forEach(([f, v], i) => {
        const o = ctx.createOscillator(); o.type = i === 2 ? 'sine' : 'triangle';
        o.frequency.value = f;
        const g = ctx.createGain(); g.gain.value = v;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
        o.connect(g); g.connect(lp); lp.connect(master); lp.connect(wetIn);
        o.start();
      });

      // 和声：每 9 秒换一个和弦
      function nextChord() {
        const ch = CHORDS[chordIdx % CHORDS.length];
        const t = ctx.currentTime + 0.1;
        ch.forEach((f, i) => organNote(f, t, 10, 0.055 - i * 0.006));
        // 换和弦时敲一声钟（不是每次，2/3 概率）
        if (Math.random() < 0.66) bell(ch[0] * 8, t + 0.2, 0.030);
        chordIdx++;
        timers.push(setTimeout(nextChord, 9000));
      }

      // 弦乐旋律：每 7-11 秒一句，级进，偶尔 G#（增四张力）
      let melIdx = 2;
      const MEL = [293.66, 311.13, 349.23, 392.00, 440.00, 466.16, 523.25]; // D F G A (+G#/Bb 张力)
      function melody() {
        const t = ctx.currentTime + 0.1;
        melIdx = Math.max(0, Math.min(MEL.length - 1, melIdx + (Math.random() < 0.55 ? 1 : -1)));
        stringNote(MEL[melIdx], t, 2.6 + Math.random() * 1.2, 0.045);
        timers.push(setTimeout(melody, 7000 + Math.random() * 4000));
      }

      // 竖琴点缀：抽牌/翻牌的期待感，每 11-18 秒一串三音
      function harpRun() {
        const t = ctx.currentTime + 0.1;
        const base = [523.25, 587.33, 659.25, 783.99][Math.floor(Math.random() * 4)];
        [0, 1, 2].forEach(i => harp(base * Math.pow(2, i * 2 / 12), t + i * 0.28, 0.030));
        timers.push(setTimeout(harpRun, 11000 + Math.random() * 7000));
      }

      master.gain.linearRampToValueAtTime(0.075, ctx.currentTime + 5);
      nextChord();
      timers.push(setTimeout(melody, 3000));
      timers.push(setTimeout(harpRun, 6000));
    } catch (e) {}
  }

  function fade(sec) {
    if (!ctx || !master) return;
    try { master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + (sec || 4)); } catch (e) {}
  }
  function toggle() {
    if (!ctx) { start(); muted = false; return true; }
    try {
      muted = !muted;
      master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.075, ctx.currentTime + 1.2);
      return !muted;
    } catch (e) { return !muted; }
  }
  // 翻牌音效：一声短钟
  function chime() {
    if (!ctx) return;
    try {
      const t = ctx.currentTime + 0.02;
      const f = 587.33;                       // D5
      bell(f, t, 0.055);
      bell(f * 1.5, t + 0.06, 0.030);         // 五度泛音，像"叮"的尾音
    } catch (e) {}
  }
  function stop() {
    timers.forEach(t => clearTimeout(t)); timers = [];
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
  }
  return { start, fade, toggle, stop, chime };
})();

// ===== 仪式过场：先停一下 → 呼吸 → 默念 → 洗牌 =====
function runRitual(done) {
  const box = $('ritual');
  const r1 = $('r1'), r2 = $('r2'), r3 = $('r3'), br = $('rbreath');
  const skip = $('skipRitual');
  let timers = [];
  const clearAll = () => { timers.forEach(t => clearTimeout(t)); timers = []; };
  const finish = () => {
    clearAll();
    box.classList.add('fade');
    setTimeout(() => { box.classList.add('hidden'); box.classList.remove('fade'); done(); }, 700);
  };
  box.classList.remove('hidden');
  // 进度点
  const dots = $('rDots');
  if (dots) dots.classList.remove('hidden');
  const setDot = (n) => { if (!dots) return; [...dots.children].forEach((d, i) => d.classList.toggle('on', i <= n)); };
  setDot(0);
  r1.classList.add('on');
  AMBIENT.start();
  timers.push(setTimeout(() => { r1.classList.remove('on'); br.style.display = 'block'; r2.classList.add('on'); setDot(1); }, 2000));
  timers.push(setTimeout(() => { r2.classList.remove('on'); br.style.display = 'none'; r3.classList.add('on'); setDot(2); }, 7000));
  timers.push(setTimeout(finish, 12000));
  skip.onclick = finish;
  const mute = $('ritualMute');
  if (mute) mute.onclick = (e) => {
    const on = AMBIENT.toggle();
    e.target.textContent = on ? '🔊' : '🔇';
  };
}

// ===== 三张牌串联：把三张单牌讲成一个故事 =====
function buildChain(items) {
  const names = items.map(it => it.c.name);
  const A = names[0], B = names[1], C = names[2] || names[1];
  // 1) 先找完全匹配的组合（顺序或集合）
  let combo = null;
  for (const cb of (CHAIN.combos || [])) {
    const cs = cb.cards || [];
    if (cs.length !== items.length) continue;
    if (cs.join('') === names.join('')) { combo = cb; break; }
    const a = [...cs].sort().join(''), b = [...names].sort().join('');
    if (a === b) { combo = cb; break; }
  }
  // 2) 挑一条公式
  const F = CHAIN.formulas || [];
  const tpl = (F[Math.floor(Math.random() * Math.max(1, F.length))] || {}).tpl || '';
  // 3) 过渡句：优先按元素关系挑（同元素/相冲/相生）
  const BR = CHAIN.bridges || [];
  const ELEM = { '火': 0, '土': 1, '风': 2, '水': 3 };
  const eA = ELEM[items[0].c.element], eB = ELEM[items[1].c.element];
  const eC = items[2] ? ELEM[items[2].c.element] : null;
  function elemLine(a, b, ea, eb) {
    if (ea == null || eb == null) return null;
    const diff = Math.abs(ea - eb);
    if (ea === eb) return '同一套东西又在「' + b + '」里演了一遍。';
    if (diff === 2) return '「' + a + '」和「' + b + '」是两股相反的劲，你被夹在中间。';
    if (diff === 1) return '从「' + a + '」走到「' + b + '」，是换了种方式处理同一件事。';
    return '「' + a + '」到「' + b + '」，绕了一个不小的弯。';
  }
  const pick = (arr, i) => arr.length ? arr[i % arr.length] : '';
  const tplBridge = (arr, i, x, y) => pick(arr, i).replace(/\{A\}/g, x).replace(/\{B\}/g, y);
  const b1 = elemLine(A, B, eA, eB) ||
    tplBridge(BR, Math.floor(Math.random() * Math.max(1, BR.length)), A, B);
  const b2 = (items[2] ? (elemLine(B, C, eB, eC) ||
    tplBridge(BR, Math.floor(Math.random() * Math.max(1, BR.length)) + 1, B, C)) : '');
  // 4) 收尾
  const E = CHAIN.endings || [];
  const end = E.length ? E[Math.floor(Math.random() * E.length)] : '';

  const line = f => (tpl || '')
    .replace(/\{A\}/g, A).replace(/\{B\}/g, B).replace(/\{C\}/g, C);

  let html = '<div class="rep"><b>连起来看</b>' +
    '<div class="chain-names">' + A + ' <span>→</span> ' + B + ' <span>→</span> ' + C + '</div>';
  if (combo) {
    html += '<div class="chain-story">' + combo.story + '</div>';
  }
  html += '<div class="chain-tpl">' + line(tpl) + '</div>';
  // 逐张落地：用每张牌自己的扎心句
  const kw = (it) => (it.c.kw_up || []).slice(0, 2).join('、');
  html += '<div class="chain-step"><b>' + items[0].label + ' · ' + A + '</b>' +
          (kw(items[0]) ? '<span class="chain-kw">' + kw(items[0]) + '</span>' : '') +
          '<br>' + (items[0].c.zha || '') + '</div>';
  html += '<div class="chain-bridge">' + b1 + '</div>';
  html += '<div class="chain-step"><b>' + items[1].label + ' · ' + B + '</b>' +
          (kw(items[1]) ? '<span class="chain-kw">' + kw(items[1]) + '</span>' : '') +
          '<br>' + (items[1].c.zha || '') + '</div>';
  if (items[2]) {
    html += '<div class="chain-bridge">' + b2 + '</div>';
    html += '<div class="chain-step"><b>' + items[2].label + ' · ' + C + '</b>' +
            (kw(items[2]) ? '<span class="chain-kw">' + kw(items[2]) + '</span>' : '') +
            '<br>' + (items[2].c.zha || '') + '</div>';
  }
  if (combo && combo.hint) html += '<div class="chain-hint">' + combo.hint + '</div>';
  if (end) html += '<div class="chain-end">' + end + '</div>';
  html += '</div>';
  return html;
}

// ---- 存图 ----
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
function wrapLines(ctx,text,maxW){const out=[];let cur='';for(const ch of text){if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
async function buildCardImage(items){
  const c0 = items[0].c, W = 1080, H = 1350;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  // 背景：深紫→深蓝渐变 + 顶部光晕
  const g = x.createLinearGradient(0, 0, W*0.7, H);
  g.addColorStop(0, '#1b1433'); g.addColorStop(0.55, '#150f28'); g.addColorStop(1, '#0c1119');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const halo = x.createRadialGradient(W*0.5, H*0.28, 40, W*0.5, H*0.28, W*0.62);
  halo.addColorStop(0, 'rgba(180,150,255,.22)'); halo.addColorStop(1, 'rgba(180,150,255,0)');
  x.fillStyle = halo; x.fillRect(0, 0, W, H);

  // 顶部小标题
  x.fillStyle = 'rgba(200,190,240,.75)';
  x.font = '30px "Microsoft YaHei",sans-serif';
  x.fillText('深 海 塔 罗', 72, 96);
  x.fillStyle = 'rgba(160,175,200,.55)';
  x.font = '24px "Microsoft YaHei",sans-serif';
  x.fillText('22 张大阿卡纳 · 抽一张看看', 72, 136);

  // 牌面（居中放大，带圆角阴影）
  const cw = 420, ch = Math.round(cw * 1.5);
  const cx = (W - cw) / 2, cy = 176;
  x.save();
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 40; x.shadowOffsetY = 18;
  x.fillStyle = '#0d1020';
  roundRect(x, cx, cy, cw, ch, 18); x.fill();
  x.restore();
  const n = String(c0.n).padStart(2, '0');
  try {
    const im = await loadImage(deckPrefix + n + '.webp' + IMG_V);
    x.save();
    roundRect(x, cx, cy, cw, ch, 18); x.clip();
    if (c0.isRev) {
      x.translate(cx + cw/2, cy + ch/2); x.rotate(Math.PI);
      x.translate(-(cx + cw/2), -(cy + ch/2));
    }
    x.drawImage(im, cx, cy, cw, ch);
    x.restore();
  } catch (e) {}

  // 牌名
  x.textAlign = 'center';
  x.fillStyle = '#f4eeff';
  x.font = 'bold 76px "Microsoft YaHei",serif';
  x.fillText(c0.name, W/2, cy + ch + 96);
  x.fillStyle = 'rgba(190,175,230,.85)';
  x.font = '30px "Microsoft YaHei",sans-serif';
  x.fillText((c0.en || '') + ' · ' + (c0.isRev ? '逆位' : '正位'), W/2, cy + ch + 142);

  // 关键词胶囊
  const kws = (c0.isRev ? c0.kw_rev : c0.kw_up).slice(0, 3);
  x.font = '28px "Microsoft YaHei",sans-serif';
  let totalW = 0;
  const pads = kws.map(k => { const w = x.measureText(k).width + 44; totalW += w + 16; return w; });
  let px = W/2 - (totalW - 16) / 2;
  const py = cy + ch + 172;
  kws.forEach((k, i) => {
    x.fillStyle = 'rgba(150,130,220,.20)';
    roundRect(x, px, py, pads[i], 52, 26); x.fill();
    x.fillStyle = '#d9ccff';
    x.fillText(k, px + pads[i]/2, py + 36);
    px += pads[i] + 16;
  });

  // 一句解读
  x.textAlign = 'left';
  x.fillStyle = 'rgba(232,238,250,.92)';
  x.font = '34px "Microsoft YaHei",sans-serif';
  const body = (c0.isRev ? c0.rev : c0.up) || '';
  wrapLines(x, body, 920).slice(0, 2).forEach((ln, i) => {
    x.fillText(ln, 90, py + 108 + i * 50);
  });

  // 底部
  x.fillStyle = 'rgba(255,255,255,.06)';
  x.fillRect(0, H - 150, W, 150);
  x.fillStyle = 'rgba(255,196,138,.9)';
  x.font = 'bold 30px "Microsoft YaHei",sans-serif';
  x.fillText('你也来抽一张', 90, H - 92);
  x.fillStyle = 'rgba(150,170,210,.85)';
  x.font = '26px "Microsoft YaHei",sans-serif';
  x.fillText('mumufish233.github.io/mood/tarot', 90, H - 48);
  return cv;
}

function roundRect(ctx, x0, y0, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  ctx.arcTo(x0, y0 + h, x0, y0, r);
  ctx.arcTo(x0, y0, x0 + w, y0, r);
  ctx.closePath();
}
</script>
