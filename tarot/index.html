<style>

         box-shadow:0 10px 30px rgba(0,0,0,.45)}

  .shuffling .stack:nth-child(1){animation:sh1 1.2s ease-in-out infinite}
  .shuffling .stack:nth-child(2){animation:sh2 1.2s ease-in-out infinite}
  .shuffling .stack:nth-child(3){animation:sh3 1.2s ease-in-out infinite}
  @keyframes sh1{0%,100%{transform:translate(-6px,0) rotate(-4deg)}50%{transform:translate(46px,-14px) rotate(7deg)}}

  .slot{width:170px;text-align:center}

  .slot img{width:100%;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .rep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
  .rep b{color:var(--warm)}
  .hue{font-size:24px;font-weight:800;margin:2px 0 8px;
       background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .adv{background:#1a2130;border:1px dashed #3a4a66;border-radius:12px;padding:14px;margin-top:10px}
  .dom{margin-top:9px;font-size:14px;color:#cfd8e8}
  .dom b{color:var(--warm)}
  .row{display:flex;gap:10px;margin-top:14px}
  .row button{flex:1;padding:13px;background:linear-gradient(135deg,var(--a),var(--b));color:#0b0d14;font-weight:800}
  .row button.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:600}
  footer{color:#5a677d;font-size:12px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
</style>

  </footer>

const CARDS = [{"n": 0, "roman": "0", "name": "愚人", "en": "The Fool", "kw_up": ["开始", "轻盈", "尝试"], "kw_rev": ["鲁莽", "逃避", "不敢开始"], "up": "你正站在一个还没被定义的路口，脚下没有地图，但也没有包袱。", "rev": "你想动，却一直在等一个完全准备好的时刻——那个时刻不会来。", "adv_up": "先做一件小到不可能失败的事，让身体先动起来。", "adv_rev": "把最坏的结果写下来，你会发现大部分担忧没有对应的事实。", "hint": "开始", "story": "愚人是唯一不带编号的牌——或者说，它的编号是 0。它拿着行李走向悬崖，脚下是空的，头顶是太阳。它不代表愚蠢，代表「还没有被经验污染的那部分你」。", "up_long": "你现在处在一个「还没定型」的位置。这既让人慌，也让人自由：因为还没有人（包括你自己）替你写好剧本。\n很多机会不是给「最准备好的人」的，是给「先动起来的人」的。\n你现在缺的不是能力，是第一个动作。", "rev_long": "你心里其实很想去，但你给自己找了个很体面的理由：「再准备一下」。\n准备是好事，但准备着准备着，就变成了不出发。\n注意：真正的风险不是失败，是你一年后还在原地解释为什么不出发。", "domains": {"emotion": "情绪：有点飘，既兴奋又不安，这很正常。", "relation": "关系：别急着定义，先相处，别用「以后怎么办」吓自己。", "work": "工作/学业：先做最小的一步，做完再看下一步。", "body": "身体：需要动一动，别一直坐着想。", "self": "自我对话：把「我还没准备好」换成「我可以边做边学」。"}}, {"n": 1, "roman": "I", "name": "魔术师", "en": "The Magician", "kw_up": ["行动", "资源", "表达"], "kw_rev": ["空转", "藏着不用", "自我怀疑"], "up": "你手上的东西比你以为的多：会的事、认识的人、能用的工具。", "rev": "你不是没能力，是把能力收得太紧，怕用出来被评价。", "adv_up": "挑一件你一直说等有空再做的小事，今天做第一步。", "adv_rev": "允许自己表现得不完美一次，看看会发生什么。", "hint": "资源", "story": "魔术师桌上摆着四样工具：杯、剑、杖、币，分别代表情感、思考、行动和物质。他不是有 magic 的人，他是「知道怎么用手里东西」的人。", "up_long": "你现在最缺的不是新资源，是把已有资源用起来的动作。\n你会的东西比你承认的多，你认识的人比你用的多，你有的工具比你打开的多。\n这张牌提醒你：现在就可以开始，不需要等更多条件。", "rev_long": "你有很多想法，但一直停在「想」。\n也可能是你怕做出来被比较、被评价、被说「不过如此」。\n藏起来最安全，但也最没有回报。", "domains": {"emotion": "情绪：想表达，但一直压着；说出来会轻一点。", "relation": "关系：主动一点，别等对方猜。", "work": "工作/学业：把手上的东西组合一下，可能就有新解法。", "body": "身体：需要把能量用出去，否则会变成焦虑。", "self": "自我对话：你不需要更厉害才能开始，你开始了才会更厉害。"}}, {"n": 2, "roman": "II", "name": "女祭司", "en": "The High Priestess", "kw_up": ["直觉", "沉默", "内在"], "kw_rev": ["压住声音", "过度分析"], "up": "有些答案你其实已经知道了，只是还没允许自己承认。", "rev": "你一直在用「讲道理」盖过心里那个声音。", "adv_up": "今天有个决定，先别问别人，写下你自己的第一反应。", "adv_rev": "给自己十分钟什么都不分析，只听身体的感受。", "hint": "直觉", "story": "女祭司坐在两根柱子之间，手里拿着卷轴却不打开。她代表「知道但不说」的那部分——不是隐瞒，是那些还没成形的、属于你的答案。", "up_long": "你现在需要的不是更多信息，是安静下来听自己。\n你已经收集够了，缺的是承认。\n注意：当你反复问别人「我该怎么办」，往往是因为你心里有答案但不敢认。", "rev_long": "你在用理性把所有感受都解释掉。\n解释得很通，但身体还是不舒服——那就是没被听见的部分。\n过度分析有时候是一种高级的逃避。", "domains": {"emotion": "情绪：有东西在，但你说不清；别急着命名它。", "relation": "关系：有些话不需要说破，但你要先对自己说清。", "work": "工作/学业：直觉给你的方向，值得记下来备查。", "body": "身体：它在替你说话，注意睡眠和胃口的变化。", "self": "自我对话：安静不是空白，安静是听。"}}, {"n": 3, "roman": "III", "name": "女皇", "en": "The Empress", "kw_up": ["滋养", "丰盛", "身体"], "kw_rev": ["耗尽", "过度付出", "忽视自己"], "up": "你身上有让东西生长的能力——但前提是，你自己也得被浇灌。", "rev": "你把滋养都给了别人，自己那份一直是欠着的。", "adv_up": "今天给自己一次「无用的照顾」：好好吃一顿、睡一觉、晒会太阳。", "adv_rev": "列出你最近照顾过的三个人，然后问：谁在照顾我？", "hint": "滋养", "story": "女皇坐在麦田里，身边是流水和成熟的水果。她不是「生孩子」，她是「让东西生长」的能量——包括让别人长好，也包括让你自己长好。", "up_long": "你有很强的照顾能力，这是天赋，不是义务。\n但记住：一个空掉的杯子倒不出水。\n你现在需要的不是再努力照顾谁，是允许自己被照顾。", "rev_long": "你在用照顾别人来换取被需要的感觉。\n这很温柔，也很消耗——因为它把你的价值绑在了「有用」上。\n试着让一次「什么都不做」也成立。", "domains": {"emotion": "情绪：有点空，像刚送走很多人之后的安静。", "relation": "关系：你在给，但也要敢开口要。", "work": "工作/学业：别把全部精力投进去，留一点给自己。", "body": "身体：它在提醒你：吃、睡、晒太阳，这三件事现在最急。", "self": "自我对话：你也可以是被照顾的那个。"}}, {"n": 4, "roman": "IV", "name": "皇帝", "en": "The Emperor", "kw_up": ["秩序", "边界", "掌控"], "kw_rev": ["僵化", "控制", "被压住"], "up": "你需要一点结构：规则、时间表、明确的「不行」。", "rev": "你把「撑住一切」当成了责任，但那是控制，不是负责。", "adv_up": "给这周定一条硬边界，比如十一点后不看工作消息。", "adv_rev": "把一件你想控制的事交出去，观察它有没有真的塌。", "hint": "边界", "story": "皇帝坐在石座上，手里是权杖和宝球。他代表规则、秩序、边界——不是暴君，是那个「让事情有形状」的力量。", "up_long": "你现在缺的是结构，不是意志力。\n当生活没有边界时，所有事都变成紧急的事，人就会耗尽。\n给自己一条线，比给自己一个目标更有效。", "rev_long": "你在用「掌控」来换安全感，但越控越累。\n而且你控制的范围，已经越过了你的责任边界。\n有些事本来就该由别人负责。", "domains": {"emotion": "情绪：紧绷，需要一条能松开的边界。", "relation": "关系：说清楚「这件事我不管」，是负责，不是冷漠。", "work": "工作/学业：把任务切块、定时，别再「有空就做」。", "body": "身体：久坐、肩颈紧，和「一直端着」有关。", "self": "自我对话：负责不等于全包。"}}, {"n": 5, "roman": "V", "name": "教皇", "en": "The Hierophant", "kw_up": ["师承", "规则", "共同体"], "kw_rev": ["盲从", "被规训", "想脱离"], "up": "你需要参照系：前人怎么做、行业规矩是什么。", "rev": "你在用别人的标准衡量自己，而那套标准可能本来就不适合你。", "adv_up": "找一个人请教——不是求答案，是看他怎么思考。", "adv_rev": "问自己：这个「应该」是谁的声音？", "hint": "标准", "story": "教皇代表传统、体系、师承。他给你一套现成的答案，也给你一副现成的枷锁。\n关键不是要不要这套答案，是你要知道自己在用谁的答案。", "up_long": "你现在需要一个参照系：有人走过这条路，能告诉你哪里有坑。\n这不是丢人，这是效率。\n但记住：参照系是用来借路的，不是用来当判决书的。", "rev_long": "你被「应该怎样」绑住了：应该稳定、应该懂事、应该先苦后甜。\n这些声音很可能是别人的，不是你的。\n不一定要推翻它，但你要知道自己正在按谁的剧本活。", "domains": {"emotion": "情绪：有一种「我说不上哪里不对」的压抑感。", "relation": "关系：别用世俗标准给关系打分。", "work": "工作/学业：找个人带带你，比一个人硬啃快。", "body": "身体：需要一点轻松，不用事事都正确。", "self": "自我对话：分清楚「我想」和「应该」。"}}, {"n": 6, "roman": "VI", "name": "恋人", "en": "The Lovers", "kw_up": ["选择", "联结", "对齐"], "kw_rev": ["摇摆", "不一致", "依赖"], "up": "这不是「爱不爱」的题，是「要不要真的选」的题。", "rev": "你两边都想要，所以两边都没站稳。", "adv_up": "把选项写下来，删到只剩一个，然后承认它。", "adv_rev": "先允许自己暂时不选——但别骗自己说「还在考虑」。", "hint": "选择", "story": "恋人牌讲的不只是爱情，更是「选择」：两个人站在树下，一个看向天使，一个看向地面。它讲的是「你选了哪一个版本的自己」。", "up_long": "你现在面对的是一个真正的选择题，不是「全都想要」的题。\n每个选项都要有代价，没有哪条路是纯赚的。\n选了之后，别回头一直看另一条。", "rev_long": "你在摇摆，因为你想避免承担选择的后果。\n但「不选」本身也是一种选择——而且通常是最差的那种，因为它让别人替你选。\n也可能：你选了一个，但心里还在算另一个，所以两边都没投入。", "domains": {"emotion": "情绪：纠缠，因为心里同时有两个答案。", "relation": "关系：要就说要，不要就明确说不要。", "work": "工作/学业：认一个方向，别的先放掉。", "body": "身体：纠结消耗很真实，会累。", "self": "自我对话：没有完美选项，只有你愿意承担的那个。"}}, {"n": 7, "roman": "VII", "name": "战车", "en": "The Chariot", "kw_up": ["推进", "意志", "方向"], "kw_rev": ["硬撑", "失控", "方向不明"], "up": "你现在有推进力，关键是把力气使在同一个方向上。", "rev": "你在用力，但两匹马往不同方向拉——越用力越散。", "adv_up": "这周只保留一个主目标，其他都降级。", "adv_rev": "停下来问：我是在前进，还是在原地加速？", "hint": "方向", "story": "战车由两只不同颜色的狮身兽拉动。驭者没有缰绳，靠的是意志。它讲的是「如何让互相冲突的力量往一个方向走」。", "up_long": "你有能量，也有决心，问题在方向散。\n当一件事被拆成五个方向，每个都只得到五分之一。\n集中，是这张牌唯一的建议。", "rev_long": "你在用「忙」证明自己没停。\n但忙不等于前进，有时候只是原地高速旋转。\n也可能是你在硬撑一个已经不想去的地方。", "domains": {"emotion": "情绪：急，容易燥。", "relation": "关系：别用强势推进关系，会反。", "work": "工作/学业：砍掉次要目标，只留一个。", "body": "身体：过度消耗，注意别熬夜硬扛。", "self": "自我对话：方向比速度重要。"}}, {"n": 8, "roman": "VIII", "name": "力量", "en": "Strength", "kw_up": ["温柔", "耐心", "驯服"], "kw_rev": ["自我压抑", "硬扛", "内耗"], "up": "真正的力量不是压住情绪，是和它共处。", "rev": "你对自己的情绪用了太大力气——压住了，但没消化。", "adv_up": "对一个反复出现的情绪说：「我知道你在。」不用赶走它。", "adv_rev": "把「我必须坚强」改成「我可以先软下来一次」。", "hint": "情绪", "story": "力量牌上，一个女孩轻轻合上狮子的嘴。她没有用武器。\n它讲的不是压制，是「温柔地驯服」——包括驯服你自己的恐惧。", "up_long": "你不需要更硬，你需要更稳。\n稳的意思是：情绪来了，你能陪着它，而不是被它推走或把它按死。\n这会慢一点，但它管得久。", "rev_long": "你在硬撑。撑得很像没事，但你自己知道那不是真的。\n压抑不会让情绪消失，只会让它换个地方冒出来——失眠、暴躁、突然的疲惫。", "domains": {"emotion": "情绪：别再压了，让它有个出口。", "relation": "关系：你可以示弱一次，那不会让你掉价。", "work": "工作/学业：别用蛮力冲，用节奏。", "body": "身体：紧绷的地方，是它在替你扛。", "self": "自我对话：温柔不是软弱。"}}, {"n": 9, "roman": "IX", "name": "隐者", "en": "The Hermit", "kw_up": ["独处", "内省", "放慢"], "kw_rev": ["孤立", "逃避社交", "闷住"], "up": "你需要一段不被打扰的时间，不是为了效率，是为了听见自己。", "rev": "独处已经变成躲避——你不是在休息，是在撤退。", "adv_up": "今天留一小时，不刷手机、不回消息，只做一件慢事。", "adv_rev": "找一个你信的人说一句话，不用解释太多。", "hint": "独处", "story": "隐者提着灯站在山顶，灯里是一颗星。他不是逃避世界的人，他是「先照清自己再回去」的人。", "up_long": "你需要退一步，但不是永远退。\n独处能恢复你，但独处太久会变成茧。\n把这段时间当「充电」，不是「搬家」。", "rev_long": "你已经躲太久了。\n「我需要空间」这句话，说了很多次之后，会变成不想面对。\n注意：如果每次难受都靠消失来解决，问题会一直在原地等你。", "domains": {"emotion": "情绪：需要安静，但别安静到没人知道你在哪。", "relation": "关系：可以有距离，但别失联。", "work": "工作/学业：一个人啃不动的时候，找人聊十分钟。", "body": "身体：需要休息，也需要阳光和走动。", "self": "自我对话：独处是为了回来，不是为了离开。"}}, {"n": 10, "roman": "X", "name": "命运之轮", "en": "Wheel of Fortune", "kw_up": ["转折", "周期", "变化"], "kw_rev": ["卡住", "重复", "时机未到"], "up": "有些东西正在变，不由你控制，但你可以选择怎么迎接。", "rev": "你困在同一个循环里，因为每次都在同一个地方做同样的选择。", "adv_up": "接受一件「已经变了」的事，别再假装它没变。", "adv_rev": "找出这个循环里，唯一一个你能改变的动作。", "hint": "变化", "story": "轮子一直在转，上面的人一会儿在上，一会儿在下。这张牌最残酷的地方是：它不承诺你会一直好，但也不承诺你会一直坏。", "up_long": "现在处在一个转折点上。\n有些事不是你想不想变，是它已经在变。\n你能做的是「接住变化」，而不是「假装没变」。", "rev_long": "你在同一个循环里重复：同样的关系模式、同样的工作困境、同样的自我怀疑。\n因为每次到同一个岔口，你都做了同一个选择。\n破局点很小：换一个动作。", "domains": {"emotion": "情绪：起伏大，像坐轮子。", "relation": "关系：老问题又出现了，这次换个回应方式。", "work": "工作/学业：机会在动，别死守旧计划。", "body": "身体：状态忽好忽坏，规律作息最要紧。", "self": "自我对话：变不是失控，是轮子在转。"}}, {"n": 11, "roman": "XI", "name": "正义", "en": "Justice", "kw_up": ["权衡", "诚实", "因果"], "kw_rev": ["自我审判", "失衡", "回避"], "up": "该算清的账，终于要算清了——包括你对自己的那笔。", "rev": "你在用最严的标准审判自己，对别人却宽容得多。", "adv_up": "把一件事的责任分成「我的部分」和「不在我控制内的部分」。", "adv_rev": "写下一句「我已经尽力了」，然后允许它成立。", "hint": "公平", "story": "正义牌上的人一手拿剑一手拿天平：天平用来衡量，剑用来切断。它讲的是「看清事实，然后做决断」。", "up_long": "你现在需要一次诚实的盘点。\n不是审判，是核对：哪些是我的责任，哪些不是。\n把它分开，你会轻很     d.onclick = () => choose(i, d);
    g.appendChild(d);
  });
  $('pickBox').classList.remove('hidden');
  $('pickHint').textContent = mode === 1 ? '选一张牌（剩下的交给直觉）'
    : '选第 ' + (picked.length + 1) + ' 张（共 ' + mode + ' 张）';
}

function choose(i, el) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  picked.push(pool[i]);
  if (picked.length < mode) {
    $('pickHint').textContent = '选第 ' + (picked.length + 1) + ' 张（共 ' + mode + ' 张）';
    return;
  }
  $('pickBox').classList.add('hidden');
  showResult();
}

function showResult() {
  let html = '<div class="flip">';
  picked.forEach((c, i) => {
    const pos = mode === 1 ? '' : '<div class="pos">' + POS[i] + '</div>';
    const img = 'cards/' + String(c.n).padStart(2,'0') + '.png';
    const rot = c.isRev ? 'transform:rotate(180deg)' : '';
    html += '<div class="slot">' + pos + '<img src="' + img + '" alt="' + c.name + '" style="' + rot + '"></div>';
  });
  html += '</div>';

  picked.forEach((c, i) => {
    const pos = mode === 1 ? '这张牌说' : POS[i];
    const kw = (c.isRev ? c.kw_rev : c.kw_up).join(' · ');
    const long = c.isRev ? c.rev_long : c.up_long;
    const adv = c.isRev ? c.adv_rev : c.adv_up;
    let doms = '';
    Object.keys(c.domains).forEach(k => {
      doms += '<div class="dom"><b>' + DOMNAME[k] + '</b><br>' + c.domains[k] + '</div>';
    });
    html += '<div class="rep">'
      + '<div class="sub" style="margin-bottom:4px">' + pos + ' · ' + (c.isRev ? '逆位' : '正位') + '</div>'
      + '<div class="hue">' + c.name + ' <span style="font-size:14px;color:var(--dim)">' + c.en + '</span></div>'
      + '<div style="color:var(--dim);font-size:13.5px;margin-bottom:10px">' + kw + '</div>'
      + '<div style="color:var(--dim);font-size:13.5px;line-height:1.7;margin-bottom:10px">' + c.story + '</div>'
      + '<div style="white-space:pre-line">' + long + '</div>'
      + '<div class="adv"><b>可以做的一件事：</b><br>' + adv + '</div>'
      + '<div style="margin-top:12px">' + doms + '</div>'
      + '</div>';
  });

  if (mode === 1) {
    html += '<div class="rep"><b>这张牌给的一句话</b><br>' + picked[0].up + '</div>';
  } else {
    html += '<div class="rep"><b>三张牌连起来看</b><br>'
      + '过去那张说的是你怎么走到这里的，现在这张是你此刻的位置，未来那张不是预言，'
      + '而是「如果按现在的方式走下去，大概率会到的地方」。<br><br>你随时可以改方向。</div>';
  }

  html += '<div class="row"><button id="again">再抽一次</button>'
    + '<button class="ghost" id="share">发给朋友</button></div>'
    + '<div class="row"><button id="saveCard">保存这张结果图</button></div>';

  const box = $('resultBox');
  box.innerHTML = html;
  box.classList.remove('hidden');
  box.scrollIntoView({behavior:'smooth'});

  $('again').onclick = () => {
    picked = [];
    box.classList.add('hidden');
    $('modeBox').classList.remove('hidden');
  };
  $('share').onclick = async (e) => {
    const url = 'https://mumufish233.github.io/mood/tarot/';
    const c0 = picked[0];
    const text = mode === 1
      ? '我抽到「' + c0.name + '」（' + (c0.isRev ? '逆位' : '正位') + '）：' + (c0.isRev ? c0.rev : c0.up)
      : '我抽了三张牌：' + picked.map(c => c.name).join(' · ');
    try {
      if (navigator.share) { await navigator.share({title:'深海塔罗', text, url}); return; }
      await navigator.clipboard.writeText(text + '\n' + url);
      e.target.textContent = '已复制，去粘贴吧';
    } catch (err) { e.target.textContent = url; }
  };
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = rej; im.src = src;
  });
}
function wrapLines(ctx, text, maxW) {
  const out = []; let cur = '';
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
async function buildCardImage() {
  const c0 = picked[0];
  const W = 1080, H = 1440;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#1a1530'); g.addColorStop(0.6, '#241a38'); g.addColorStop(1, '#12222f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // 右侧卡面图
  const cw = 340, ch = 531;
  const cx0 = W - 70 - cw, cy0 = 110;
  const imgPath = 'cards/' + String(c0.n).padStart(2,'0') + '.png';
  try {
    const im = await loadImage(imgPath);
    x.save();
    if (c0.isRev) {
      x.translate(cx0 + cw/2, cy0 + ch/2);
      x.rotate(Math.PI);
      x.translate(-(cx0 + cw/2), -(cy0 + ch/2));
    }
    x.drawImage(im, cx0, cy0, cw, ch);
    x.restore();
  } catch (e) {}

  const LEFT_W = 520;
  x.fillStyle = '#9aa6ba'; x.font = '32px "Microsoft YaHei",sans-serif';
  x.fillText('我抽到的牌', 80, 120);
  x.fillStyle = '#c9a7ff'; x.font = 'bold 84px "Microsoft YaHei",sans-serif';
  x.fillText(c0.name, 80, 226);
  x.fillStyle = '#8fd3ff'; x.font = '30px "Microsoft YaHei",sans-serif';
  x.fillText(c0.en + ' · ' + (c0.isRev ? '逆位' : '正位'), 80, 282);
  const kw = (c0.isRev ? c0.kw_rev : c0.kw_up).join(' · ');
  x.fillStyle = '#93a2b8'; x.font = '26px "Microsoft YaHei",sans-serif';
  x.fillText(kw, 80, 336);

  const line = c0.isRev ? c0.rev : c0.up;
  x.fillStyle = '#eef2f9'; x.font = 'bold 40px "Microsoft YaHei",sans-serif';
  wrapLines(x, line, LEFT_W).forEach((ln, i) => x.fillText(ln, 80, 420 + i * 56));

  // 牌面故事（小字，左侧）
  x.fillStyle = 'rgba(147,162,184,.85)'; x.font = '24px "Microsoft YaHei",sans-serif';
  wrapLines(x, c0.story, LEFT_W).slice(0, 5).forEach((ln, i) => x.fillText(ln, 80, 640 + i * 38));

  // 建议（整宽，位于图下方）
  x.fillStyle = '#ffc08a'; x.font = 'bold 30px "Microsoft YaHei",sans-serif';
  x.fillText('可以做的一件事', 80, 860);
  x.fillStyle = '#d6ddea'; x.font = '30px "Microsoft YaHei",sans-serif';
  const adv = c0.isRev ? c0.adv_rev : c0.adv_up;
  wrapLines(x, adv, 920).forEach((ln, i) => x.fillText(ln, 80, 912 + i * 44));

  // 底部
  x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(0, 1240, W, 200);
  x.fillStyle = '#ffc08a'; x.font = 'bold 32px "Microsoft YaHei",sans-serif';
  x.fillText('深海塔罗 · 22 张大阿卡纳', 80, 1310);
  x.fillStyle = '#8fd3ff'; x.font = '26px "Microsoft YaHei",sans-serif';
  x.fillText('mumufish233.github.io/mood/tarot', 80, 1364);
  return cv;
}
document.addEventListener('click', async (e) => {
  if (!e.target || e.target.id !== 'saveCard') return;
  if (!picked.length) return;
  e.target.textContent = '生成中…';
  try {
    const cv = await buildCardImage();
    const a = document.createElement('a');
    a.download = '塔罗-' + picked[0].name + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
    e.target.textContent = '已保存，去相册看看';
  } catch (err) {
    e.target.textContent = '生成失败：' + err.message;
  }
});
</script>
</body>
</html>
