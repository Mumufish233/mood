$('moreBtn').onclick = (e) => {
  mb.classList.toggle('hidden');
  e.target.classList.toggle('active', !mb.classList.contains('hidden'));
};

function startSpread(s) {
  spread = s; picked = [];
  $('home').classList.add('hidden');
  $('resultBox').classList.add('hidden');
  $('shuffleBox').classList.remove('hidden');
  setTimeout(() => {
    $('deck').classList.remove('shuffling');
    $('shuffleBox').classList.add('hidden');
    startPick();
  }, 1500);
}

function shuffled(n) {
  const p = CARDS.map(c => ({...c, isRev: Math.random() < REV}));
  for (let i = p.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  return p.slice(0, n);
}

function startPick() {
  pool = shuffled(12);
  const g = $('pickGrid');
  g.innerHTML = '';
  pool.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'pick'; el.textContent = i + 1;
    el.onclick = () => pickOne(el, i);
    g.appendChild(el);
  });
  $('pickBox').classList.remove('hidden');
  $('pickHint').textContent = '选第 1 张（' + spread.positions[0].label + '）';
}

function pickOne(el, i) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  picked.push(pool[i]);
  if (picked.length < spread.count) {
    $('pickHint').textContent = '选第 ' + (picked.length + 1) + ' 张（' +
      spread.positions[picked.length].label + '）';
    return;
  }
  $('pickBox').classList.add('hidden');
  render();
}

function imgTag(c, style) {
  const n = String(c.n).padStart(2, '0');
  return '<img src="' + deckPrefix + n + '.png" style="' + style + '" alt="" ' +
         'onerror="this.onerror=null;this.src=&#39;cards/' + n + '.png&#39;">';
}

function render(list) {
  const items = list || picked.map((c, i) => ({c, label: spread.positions[i].label,
                                               prompt: spread.positions[i].prompt}));
  let html = '<div class="flip">';
  items.forEach(it => {
    const rot = it.c.isRev ? 'transform:rotate(180deg)' : '';
    html += '<div class="slot"><div class="pos">' + it.label + '</div>' + imgTag(it.c, rot) + '</div>';
  });
  html += '</div>';

  items.forEach(it => {
    const c = it.c, rev = c.isRev;
    html += '<div class="rep">' +
      '<div style="color:var(--dim);font-size:12.5px">' + it.label + ' · ' + it.prompt + '</div>' +
      '<div class="hue">' + c.name + ' <span style="font-size:13px;color:var(--dim)">' +
      c.en + ' · ' + (rev ? '逆位' : '正位') + '</span></div>' +
      '<div style="color:var(--dim);font-size:13px;margin-bottom:8px">' +
      (c.element || '') + (c.planet ? ' · ' + c.planet : '') + ' ｜ ' +
      (rev ? c.kw_rev : c.kw_up).join(' · ') + '</div>' +
      '<div style="color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:8px">' + c.story + '</div>' +
      '<div style="white-space:pre-line">' + (rev ? c.rev_long : c.up_long) + '</div>' +
      '<div class="adv"><b>可以做的一件事：</b><br>' + (rev ? c.adv_rev : c.adv_up) + '</div>' +
      '<div class="sec"><b>爱情</b>　' + (rev ? c.love_rev : c.love_up) + '</div>' +
      '<div class="sec"><b>事业</b>　' + (rev ? c.career_rev : c.career_up) + '</div>' +
      '<div class="sec"><b>财运</b>　' + (rev ? c.money_rev : c.money_up) + '</div>' +
      '</div>';
  });

  if (items.length > 1) {
    html += '<div class="rep"><b>连起来看</b><br>' +
      items.map(it => it.label + '：' + it.c.hint).join(' → ') +
      '<br><br>牌面在讲一个过程，不是一个判决。你随时可以改方向。</div>';
  }
  html += '<div class="rep"><b>今天给你的话</b><br>' + items[items.length - 1].c.affirmation + '</div>';
  html += '<div class="row"><button id="again">再抽一次</button>' +
    '<button class="ghost" id="switchDeck">换个画风</button></div>' +
    '<div class="row"><button class="ghost" id="saveCard">保存这张结果图</button></div>';

  const rb = $('resultBox');
  rb.innerHTML = html;
  rb.classList.remove('hidden');
  rb.scrollIntoView({behavior: 'smooth'});
  $('again').onclick = () => {
    picked = [];
    rb.classList.add('hidden');
    $('home').classList.remove('hidden');
    window.scrollTo({top: 0, behavior: 'smooth'});
  };
  $('switchDeck').onclick = (e) => {
    deckStyle = (deckStyle + 1) % DECKS.length;
    deckPrefix = DECKS[deckStyle];
    document.querySelectorAll('.flip img').forEach((im, i) => {
      if (!items[i]) return;
      const n = String(items[i].c.n).padStart(2, '0');
      im.onerror = function () { this.onerror = null; this.src = 'cards/' + n + '.png'; };
      im.src = deckPrefix + n + '.png';
    });
    e.target.textContent = ['换个画风（豆包版）', '换个画风（自绘版）', '换个画风（插画版）'][deckStyle];
  };
  $('saveCard').onclick = async (e) => {
    e.target.textContent = '生成中…';
    try {
      const cv = await buildCardImage(items);
      const a = document.createElement('a');
      a.download = '塔罗-' + items[0].c.name + '.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      e.target.textContent = '已保存';
    } catch (err) { e.target.textContent = '失败：' + err.message; }
  };
}

function showDaily() {
  const d = new Date();
  const key = 'tarot-daily-' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  let seed = localStorage.getItem(key);
  if (!seed) { seed = String(Math.floor(Math.random() * 1e6)); localStorage.setItem(key, seed); }
  seed = parseInt(seed);
  const c = {...CARDS[seed % CARDS.length], isRev: (Math.floor(seed / 97) % 100) < 42};
  $('home').classList.add('hidden');
  render([{c, label: '今日', prompt: '今天这张，明天可以再来抽一张'}]);
}

// ---- 存图 ----
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
function wrapLines(ctx,text,maxW){const out=[];let cur='';for(const ch of text){if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
async function buildCardImage(items){
  const c0 = items[0].c, W=1080, H=1440;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a1530');g.addColorStop(.6,'#241a38');g.addColorStop(1,'#12222f');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const cw=340,ch=531,cx0=W-70-cw,cy0=110;
  const n=String(c0.n).padStart(2,'0');
  try{
    const im=await loadImage(deckPrefix+n+'.png');
    x.save();
    if(c0.isRev){x.translate(cx0+cw/2,cy0+ch/2);x.rotate(Math.PI);x.translate(-(cx0+cw/2),-(cy0+ch/2));}
    x.drawImage(im,cx0,cy0,cw,ch);x.restore();
  }catch(e){}
  x.fillStyle='#9aa6ba';x.font='32px "Microsoft YaHei",sans-serif';x.fillText('我抽到的牌',80,120);
  x.fillStyle='#c9a7ff';x.font='bold 84px "Microsoft YaHei",sans-serif';x.fillText(c0.name,80,226);
  x.fillStyle='#8fd3ff';x.font='30px "Microsoft YaHei",sans-serif';
  x.fillText(c0.en+' · '+(c0.isRev?'逆位':'正位'),80,282);
  x.fillStyle='#93a2b8';x.font='26px "Microsoft YaHei",sans-serif';
  x.fillText((c0.isRev?c0.kw_rev:c0.kw_up).join(' · '),80,336);
  x.fillStyle='#eef2f9';x.font='bold 40px "Microsoft YaHei",sans-serif';
  wrapLines(x,(c0.isRev?c0.rev:c0.up),520).forEach((ln,i)=>x.fillText(ln,80,420+i*56));
  x.fillStyle='rgba(147,162,184,.85)';x.font='24px "Microsoft YaHei",sans-serif';
  wrapLines(x,c0.story,520).slice(0,5).forEach((ln,i)=>x.fillText(ln,80,640+i*38));
  x.fillStyle='#ffc08a';x.font='bold 30px "Microsoft YaHei",sans-serif';x.fillText('可以做的一件事',80,860);
  x.fillStyle='#d6ddea';x.font='30px "Microsoft YaHei",sans-serif';
  wrapLines(x,(c0.isRev?c0.adv_rev:c0.adv_up),920).forEach((ln,i)=>x.fillText(ln,80,912+i*44));
  x.fillStyle='rgba(255,255,255,.08)';x.fillRect(0,1240,W,200);
  x.fillStyle='#ffc08a';x.font='bold 32px "Microsoft YaHei",sans-serif';x.fillText('深海塔罗 · 22 张大阿卡纳',80,1310);
  x.fillStyle='#8fd3ff';x.font='26px "Microsoft YaHei",sans-serif';x.fillText('mumufish233.github.io/mood/tarot',80,1364);
  return cv;
}
