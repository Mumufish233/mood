const REVERSED_CHANCE = 0.42;
let mode = 1, picks = [], pool = [], picked = [];

function $(id){ return document.getElementById(id); }

document.querySelectorAll('.mode').forEach(b => {
  b.onclick = () => {
    mode = Number(b.dataset.mode);
    picks = []; picked = [];
    $('modeBox').classList.add('hidden');
    $('shuffleBox').classList.remove('hidden');
    // 洗牌动画 1.8 秒
    setTimeout(() => {
      $('deck').classList.remove('shuffling');
      $('shuffleBox').classList.add('hidden');
      startPick();
    }, 1800);
  };
});

// 洗牌：打乱 22 张，再随机挑 12 张作为可选（避免一眼看完 22 张）
function startPick() {
  pool = CARDS.map(c => ({...c, rev: Math.random() < REVERSED_CHANCE}));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  pool = pool.slice(0, 12);
  const g = $('pickGrid');
  g.innerHTML = '';
  pool.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'pick'; d.textContent = i + 1;
    d.onclick = () => choose(i, d);
    g.appendChild(d);
  });
  $('pickBox').classList.remove('hidden');
  $('pickHint').textContent = mode === 1 ? '选一张牌（剩下的交给直觉）'
    : `选第 ${picked.length + 1} 张（共 ${mode} 张）`;
}

const POS = ['过去', '现在', '未来'];

function choose(i, el) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  picked.push(pool[i]);
  if (picked.length < mode) {
    $('pickHint').textContent = `选第 ${picked.length + 1} 张（共 ${mode} 张）`;
    return;
  }
  $('pickBox').classList.add('hidden');
  showResult();
}

function domainsFor(card, seed) {
  const keys = Object.keys(TPL);
  const out = [];
  const used = new Set();
  for (let k = 0; k < 3; k++) {
    let idx = (seed + k * 3) % keys.length;
    let guard = 0;
    while (used.has(idx) && guard++ < 10) idx = (idx + 1) % keys.length;
    used.add(idx);
    const key = keys[idx];
    const arr = TPL[key];
    out.push({name: {emotion:'情绪', relation:'关系', work:'工作/学业', body:'身体与精力', self:'自我对话'}[key],
              text: arr[(seed + k) % arr.length].replace('{kw}', card.hint)});
  }
  return out;
}

function showResult() {
  const now = new Date();
  const seed = now.getDate() + now.getHours() + picked.reduce((a, c) => a + c.n, 0);
  let html = '<div class="flip">';
  picked.forEach((c, i) => {
    const pos = mode === 1 ? '' : `<div class="pos">${POS[i]}</div>`;
    const img = `cards/${String(c.n).padStart(2,'0')}-${c.name}.png`;
    html += `<div class="slot">${pos}<img src="${img}" alt="${c.name}"
      style="${c.rev ? 'transform:rotate(180deg)' : ''}"></div>`;
  });
  html += '</div>';

  picked.forEach((c, i) => {
    const pos = mode === 1 ? '这张牌说' : POS[i];
    const main = c.rev ? c.rev : c.up;
    const adv = c.rev ? c.adv_rev : c.adv_up;
    const kw = (c.rev ? c.kw_rev : c.kw_up).join(' · ');
    html += `<div class="rep">
      <div class="sub" style="margin-bottom:4px">${pos} · ${c.rev ? '逆位' : '正位'}</div>
      <div class="hue">${c.name} <span style="font-size:14px;color:var(--dim)">${c.en}</span></div>
      <div style="color:var(--dim);font-size:13.5px;margin-bottom:8px">${kw}</div>
      <div>${main}</div>
      <div class="adv"><b>可以做的一件事：</b><br>${adv}</div>
    </div>`;
  });

  if (mode === 1) {
    const c = picked[0];
    html += '<div class="rep"><b>换个角度看三个地方</b>' +
      domainsFor(c, seed).map(d => `<div style="margin-top:10px"><b>${d.name}</b><br>${d.text}</div>`).join('') +
      '</div>';
  } else {
    html += `<div class="rep"><b>三张牌连起来看</b><br>
      过去那张说的是你怎么走到这里的，现在这张是你此刻的位置，未来那张不是预言，
      而是"如果按现在的方式走下去，大概率会到的地方"。<br><br>
      你随时可以改方向。</div>`;
  }

  html += `<div class="row">
    <button id="again">再抽一次</button>
    <button class="ghost" id="share">发给朋友</button>
  </div>`;

  const box = $('resultBox');
  box.innerHTML = html;
  box.classList.remove('hidden');
  box.scrollIntoView({behavior:'smooth'});

  $('again').onclick = () => {
    picked = [];
    box.classList.add('hidden');
    $('modeBox').classList.remove('hidden');
  };
  $('share').onclick = async (e) => {
    const url = 'https://mumufish233.github.io/mood/tarot/';
    const text = mode === 1
      ? `我抽到「${picked[0].name}」（${picked[0].rev?'逆位':'正位'}）：${picked[0].rev?picked[0].rev:picked[0].up}`
      : `我抽了三张牌：${picked.map(c=>c.name).join(' · ')}`;
    try {
      if (navigator.share) { await navigator.share({title:'深海塔罗', text, url}); return; }
      await navigator.clipboard.writeText(text + '\n' + url);
      e.target.textContent = '已复制，去粘贴吧';
    } catch (err) { e.target.textContent = url; }
  };
}
</script>
</body>
</html>
